        <!-- Card 1: Project Aurora -->
        <rect x="0" y="0" width="255" height="124" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
        <text x="18" y="32" fill="#ffffff" font-size="16" font-weight="700">Project Aurora</text>
        <rect x="195" y="18" width="44" height="18" rx="9" fill="rgba(16,185,129,0.15)"/>
        <text x="217" y="31" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">ACTIVE</text>
        <text x="18" y="60" fill="#94a3b8" font-size="12">Design system tokens &amp; UI kit</text>
        <line x1="18" y1="78" x2="237" y2="78" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="18" y="102" fill="#64748b" font-size="11">8 meetings</text>
        <circle cx="82" cy="98" r="2" fill="#64748b"/>
        <text x="92" y="102" fill="#38bdf8" font-size="11" font-weight="600">3 open tasks</text>

        <!-- Card 2: Atlas CLI -->
        <rect x="275" y="0" width="255" height="124" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
        <text x="293" y="32" fill="#ffffff" font-size="16" font-weight="700">Atlas CLI</text>
        <rect x="470" y="18" width="44" height="18" rx="9" fill="rgba(16,185,129,0.15)"/>
        <text x="492" y="31" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">ACTIVE</text>
        <text x="293" y="60" fill="#94a3b8" font-size="12">Developer toolchain &amp; scripts</text>
        <line x1="293" y1="78" x2="512" y2="78" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="293" y="102" fill="#64748b" font-size="11">5 meetings</text>
        <circle cx="357" cy="98" r="2" fill="#64748b"/>
        <text x="367" y="102" fill="#38bdf8" font-size="11" font-weight="600">4 open tasks</text>

        <!-- Card 3: Helios Engine -->
        <rect x="550" y="0" width="255" height="124" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
        <text x="568" y="32" fill="#ffffff" font-size="16" font-weight="700">Helios Engine</text>
        <rect x="745" y="18" width="44" height="18" rx="9" fill="rgba(16,185,129,0.15)"/>
        <text x="767" y="31" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">ACTIVE</text>
        <text x="568" y="60" fill="#94a3b8" font-size="12">Real-time telemetry &amp; sync</text>
        <line x1="568" y1="78" x2="787" y2="78" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="568" y="102" fill="#64748b" font-size="11">6 meetings</text>
        <circle cx="632" cy="98" r="2" fill="#64748b"/>
        <text x="642" y="102" fill="#38bdf8" font-size="11" font-weight="600">2 open tasks</text>

        <!-- Card 4: Starlight Docs -->
        <rect x="825" y="0" width="255" height="124" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
        <text x="843" y="32" fill="#ffffff" font-size="16" font-weight="700">Starlight Docs</text>
        <rect x="1010" y="18" width="54" height="18" rx="9" fill="rgba(56,189,248,0.15)"/>
        <text x="1037" y="31" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">SHIPPED</text>
