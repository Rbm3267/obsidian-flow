        <rect x="0" y="0" width="530" height="400" rx="14" fill="url(#card-grad)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="22" y="32" fill="#ffffff" font-size="15" font-weight="700">Recent Synthesized Notes</text>
        <text x="508" y="32" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="end">raw/meetings/</text>

        <g transform="translate(20, 52)">
          <!-- Note 1 -->
          <rect x="0" y="0" width="490" height="64" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
          <text x="14" y="24" fill="#38bdf8" font-size="11" font-family="'SF Mono', monospace">2026-10-12</text>
          <text x="14" y="44" fill="#f8fafc" font-size="13" font-weight="600">Project Aurora · Component State &amp; Token Spec Review</text>
          <text x="476" y="34" fill="#10b981" font-size="11" text-anchor="end">2 tasks extracted</text>

          <!-- Note 2 -->
          <rect x="0" y="74" width="490" height="64" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
          <text x="14" y="98" fill="#38bdf8" font-size="11" font-family="'SF Mono', monospace">2026-10-10</text>
          <text x="14" y="118" fill="#f8fafc" font-size="13" font-weight="600">Atlas CLI · Terminal Color Themes &amp; Autocomplete</text>
          <text x="476" y="108" fill="#10b981" font-size="11" text-anchor="end">3 tasks extracted</text>

          <!-- Note 3 -->
          <rect x="0" y="148" width="490" height="64" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
          <text x="14" y="172" fill="#38bdf8" font-size="11" font-family="'SF Mono', monospace">2026-10-08</text>
          <text x="14" y="192" fill="#f8fafc" font-size="13" font-weight="600">Helios Engine · WebSocket Reconnect &amp; Backoff Strategy</text>
          <text x="476" y="182" fill="#10b981" font-size="11" text-anchor="end">1 task extracted</text>

          <!-- Note 4 -->
          <rect x="0" y="222" width="490" height="64" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
          <text x="14" y="246" fill="#38bdf8" font-size="11" font-family="'SF Mono', monospace">2026-10-05</text>
          <text x="14" y="266" fill="#f8fafc" font-size="13" font-weight="600">Starlight Docs · Search Indexing &amp; Navigation Overhaul</text>
          <text x="476" y="256" fill="#64748b" font-size="11" text-anchor="end">All clear</text>
        </g>

        <!-- Right: Synthesis Output Note Preview (Live Note Structure) -->
        <rect x="550" y="0" width="530" height="400" rx="14" fill="#080e1c" stroke="rgba(56,189,248,0.2)" stroke-width="1.2"/>
        <text x="572" y="32" fill="#ffffff" font-size="15" font-weight="700">Synthesized Note Output Preview</text>
        <rect x="1000" y="18" width="62" height="20" rx="6" fill="rgba(167,139,250,0.15)"/>
        <text x="1031" y="32" fill="#c084fc" font-size="10.5" font-weight="600" text-anchor="middle">Markdown</text>

        <g transform="translate(572, 54)">
          <!-- YAML Frontmatter pill -->
          <rect x="0" y="0" width="486" height="54" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
          <text x="12" y="20" fill="#94a3b8" font-family="'SF Mono', monospace" font-size="10.5">title: "Component State &amp; Token Spec Review" · date: 2026-10-12</text>
          <text x="12" y="38" fill="#38bdf8" font-family="'SF Mono', monospace" font-size="10.5">account: "[[Project Aurora]]" · attendees: ["[[Alex Morgan]]", "[[Jordan Lee]]"]</text>

          <!-- Section 1: Summary -->
          <text x="0" y="80" fill="#f8fafc" font-size="13" font-weight="700">## Summary</text>
          <text x="0" y="100" fill="#cbd5e1" font-size="12">Reviewed component variants and design token definitions across web and desktop.</text>
          <text x="0" y="118" fill="#cbd5e1" font-size="12">Confirmed semantic color mappings for accessible high-contrast themes.</text>

          <!-- Section 2: Key Decisions -->
          <text x="0" y="152" fill="#f8fafc" font-size="13" font-weight="700">## Key Decisions</text>
          <text x="12" y="172" fill="#94a3b8" font-size="12">• Standardize token naming structure across design tokens and CSS variables</text>
          <text x="12" y="190" fill="#94a3b8" font-size="12">• Export platform packages via automated semantic release pipeline</text>

          <!-- Section 3: Action Items -->
          <text x="0" y="224" fill="#f8fafc" font-size="13" font-weight="700">## Action Items</text>
          <text x="12" y="246" fill="#38bdf8" font-size="12">- [ ] Benchmark token bundle size with tree-shaking enabled 📅 2026-10-14</text>
          <text x="12" y="266" fill="#38bdf8" font-size="12">- [ ] Update component catalog documentation with interactive states 📅 2026-10-16</text>
        </g>
      </g>
    </g>
  </g>
</svg>
