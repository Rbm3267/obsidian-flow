<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="vf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="50%" stop-color="#081122"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1a32" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#091224" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#vf-bg)"/>

  <!-- Ambient Glows -->
  <circle cx="180" cy="180" r="300" fill="#38bdf8" opacity="0.07" filter="blur(70px)"/>
  <circle cx="1100" cy="240" r="320" fill="#a855f7" opacity="0.06" filter="blur(80px)"/>

  <!-- Obsidian Window Frame -->
  <g filter="url(#soft-shadow)">
    <!-- Window Outer Shell -->
    <rect x="40" y="30" width="1200" height="740" rx="16" fill="#090f1d" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Window Title Bar -->
    <rect x="40" y="30" width="1200" height="42" rx="16" fill="#0c152a"/>
    <!-- Window Controls -->
    <circle cx="68" cy="51" r="6" fill="#ef4444" opacity="0.85"/>
    <circle cx="88" cy="51" r="6" fill="#f59e0b" opacity="0.85"/>
    <circle cx="108" cy="51" r="6" fill="#10b981" opacity="0.85"/>
    <!-- Breadcrumb -->
    <text x="640" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="500" text-anchor="middle">Knowledge Vault · VaultFlow Intelligence Hub</text>

    <!-- Sidebar Mini Rail -->
    <rect x="40" y="72" width="56" height="698" fill="#060b16"/>
    <!-- Nav Icons -->
    <rect x="56" y="96" width="24" height="24" rx="6" fill="rgba(56,189,248,0.15)"/>
    <circle cx="68" cy="108" r="5" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <path d="M68 144 V160 M60 152 H76" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="61" y="196" width="14" height="14" rx="3" stroke="#64748b" stroke-width="1.8" fill="none"/>

    <!-- Main Content Area -->
    <g transform="translate(120, 92)">
      <!-- Header Area -->
      <g>
        <text x="0" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" font-size="26" font-weight="800" letter-spacing="-0.02em">Account &amp; Project Intelligence</text>
        <text x="0" y="54" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">4 tracked initiatives · 18 structured synthesis notes indexed</text>
        
        <!-- One-Click Ingest Inbox Button -->
        <rect x="910" y="16" width="170" height="36" rx="8" fill="url(#blue-glow)"/>
        <path d="M928 34 L934 40 L944 28" stroke="#060b16" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="954" y="39" fill="#060b16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12.5" font-weight="700">Ingest 00_Inbox</text>
      </g>

